name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun fmt --no-script --check
      - name: Lint
        run: bun lint --no-script
      - name: Type check
        run: bun check --no-script
      - name: Build
        run: bun run build
